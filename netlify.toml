# Statische site: Netlify zet de map site/ zoals hij is online (geen buildstap) bij elke push naar main.
[build]
  publish = "site"
  command = "python3 huisstijl/huisstijl.py site vluchtwijzer"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://daisycon.tools https://tpwdg.com https://tpemb.com https://tpo.gg https://widgets.kiwi.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.kiwi.com https://*.travelpayouts.com https://images.daisycon.io https://static.daisycon.tools https://*.daisycon.io; font-src 'self'; connect-src 'self' https://daisycon.tools https://tpwdg.com https://tpemb.com https://tpo.gg https://*.travelpayouts.com https://*.kiwi.com; frame-src https://widgets.kiwi.com https://*.kiwi.com; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
